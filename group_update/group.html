<div id="groupEditApp" class="mt-3">
    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div v-else>
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Group Settings</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Slug</label>
                    <input type="text" class="form-control" :value="group.slug" readonly disabled>
                    <div class="form-text">Slug cannot be changed after creation.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Path</label>
                    <input type="text" class="form-control" :value="group.path" readonly disabled>
                    <div class="form-text">Denormalised path is derived from slug and parent.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-control" v-model="group.description"
                           placeholder="Human-readable summary">
                </div>
                <div class="mb-3">
                    <label class="form-label">Metadata (JSON, optional)</label>
                    <textarea class="form-control" v-model="group.metadata" rows="4"
                              style="font-family: monospace;"
                              placeholder='{"key":"value"}'></textarea>
                </div>
                <button type="button" class="btn btn-primary" @click="saveGroup()" :disabled="saving">
                    <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>
                    Save Changes
                </button>
                <a :href="backUrl" class="btn btn-secondary ms-2">Back</a>
            </div>
        </div>
    </div>
</div>

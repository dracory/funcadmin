<div id="groupsApp" class="mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Groups</h5>
        <button id="btn-new-group" @click="openCreateModal()" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> New Group
        </button>
    </div>

    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div v-else>
        <div v-if="groups.length === 0" class="text-center py-4 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            <p>No groups yet. Click "New Group" to create one.</p>
        </div>

        <div v-else class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-light">
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" class="form-check-input" v-model="selectAll" @change="toggleSelectAll">
                        </th>
                        <th>Slug</th>
                        <th>Path</th>
                        <th>Description</th>
                        <th>Updated</th>
                        <th style="width: 140px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="g in groups" :key="g.id">
                        <td>
                            <input type="checkbox" class="form-check-input" v-model="g.selected">
                        </td>
                        <td>
                            <strong>{{ g.slug }}</strong>
                            <div class="text-muted small">{{ g.id }}</div>
                        </td>
                        <td>
                            <span class="badge bg-info">{{ g.path }}</span>
                        </td>
                        <td>{{ g.description || '—' }}</td>
                        <td class="text-muted small">{{ g.updated_at }}</td>
                        <td>
                            <a :href="getUpdateUrl(g.id)" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" title="Delete" @click="confirmDelete(g)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div v-if="showCreateModal" class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
    <div v-if="showCreateModal" class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Group</h5>
                    <button type="button" class="btn-close" @click="closeCreateModal()"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Slug *</label>
                        <input id="group-create-slug" type="text" class="form-control" v-model="createForm.slug"
                               placeholder="e.g. transforms (no slashes)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parent (path or ID, optional)</label>
                        <input type="text" class="form-control" v-model="createForm.parent"
                               placeholder="e.g. payments (leave empty for root)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input id="group-create-description" type="text" class="form-control" v-model="createForm.description"
                               placeholder="Human-readable summary">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Metadata (JSON, optional)</label>
                        <textarea class="form-control" v-model="createForm.metadata" rows="3"
                                  style="font-family: monospace;"
                                  placeholder='{"key":"value"}'></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeCreateModal()">Cancel</button>
                    <button id="btn-create-group" type="button" class="btn btn-primary" @click="createGroup()"
                            :disabled="!createForm.slug || creating">
                        <span v-if="creating" class="spinner-border spinner-border-sm me-1"></span>
                        Create
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

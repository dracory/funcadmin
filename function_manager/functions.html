<div id="functionsApp" class="mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Functions</h5>
        <button @click="openCreateModal()" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> New Function
        </button>
    </div>

    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div v-else>
        <div v-if="functions.length === 0" class="text-center py-4 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            <p>No functions yet. Click "New Function" to create one.</p>
        </div>

        <div v-else class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-light">
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" class="form-check-input" v-model="selectAll" @change="toggleSelectAll">
                        </th>
                        <th>Name</th>
                        <th>Alias</th>
                        <th>Runtime</th>
                        <th>Timeout</th>
                        <th>Updated</th>
                        <th style="width: 180px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="fn in functions" :key="fn.id">
                        <td>
                            <input type="checkbox" class="form-check-input" v-model="fn.selected">
                        </td>
                        <td>
                            <strong>{{ fn.name || '(unnamed)' }}</strong>
                            <div class="text-muted small">{{ fn.id }}</div>
                        </td>
                        <td>
                            <span v-if="fn.alias" class="badge bg-info">{{ fn.alias }}</span>
                            <span v-else class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary">{{ fn.runtime }}</span>
                        </td>
                        <td>{{ fn.timeout_ms > 0 ? fn.timeout_ms + 'ms' : 'default' }}</td>
                        <td class="text-muted small">{{ fn.updated_at }}</td>
                        <td>
                            <a :href="getUpdateUrl(fn.id)" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a :href="getInvokeUrl(fn.id)" class="btn btn-sm btn-outline-success me-1" title="Test Invoke">
                                <i class="bi bi-play"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" title="Delete" @click="confirmDelete(fn)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Function Modal -->
    <div v-if="showCreateModal" class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
    <div v-if="showCreateModal" class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Function</h5>
                    <button type="button" class="btn-close" @click="closeCreateModal()"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name (optional)</label>
                        <input type="text" class="form-control" v-model="createForm.name" placeholder="Display name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alias (optional, unique)</label>
                        <input type="text" class="form-control" v-model="createForm.alias" placeholder="e.g. double">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Runtime</label>
                        <select class="form-select" v-model="createForm.runtime">
                            <option value="js">JavaScript (Goja)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Timeout (ms, 0 = default 5000)</label>
                        <input type="number" class="form-control" v-model.number="createForm.timeout_ms" placeholder="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Source Code *</label>
                        <textarea class="form-control" v-model="createForm.source" rows="10"
                                  style="font-family: monospace;"
                                  placeholder="return input * 2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeCreateModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" @click="createFunction()"
                            :disabled="!createForm.source || creating">
                        <span v-if="creating" class="spinner-border spinner-border-sm me-1"></span>
                        Create & Edit
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
